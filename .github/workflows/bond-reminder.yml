name: bond-reminder

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC：0 1 = 北京时间 09:00
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bond-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run reminder
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          WXPUSHER_TOPIC_IDS: ${{ secrets.WXPUSHER_TOPIC_IDS }}
          BOND_LOOKAHEAD_DAYS: ${{ vars.BOND_LOOKAHEAD_DAYS }}
          BOND_NOTIFY_WHEN_EMPTY: ${{ vars.BOND_NOTIFY_WHEN_EMPTY }}
        run: python bond_reminder.py
